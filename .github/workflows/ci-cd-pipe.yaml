name: GitHub Actions Demo
run-name: For-practice
on: [push]

#env:
 # IMAGE_NAME: adityavishwakarma31/django-todo-app
jobs:
  build:
    runs-on: self-hosted
    steps:
       - name: pull repositary
         uses: actions/checkout@v4
       - name: Get Tag
         id: vars
         run: echo ::set-output name=tag::${git describe --abbrev=0}
       - name: Build images
         run: docker build -t myapp:${{steps.vars.outputs.tag}} .
       - name: createfolder
         run: docker images
